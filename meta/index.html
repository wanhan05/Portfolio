<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Meta</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../global.js" type="module"></script>
    <script src="main.js" type="module"></script>
  </head>
  <body>
    <h1>Code Analysis</h1>
    <p>Meta-analysis of the code in this project.</p>

    <div id="stats"></div>

    <!-- Step 1.1: Time slider -->
    <div style="display: flex; flex: 1; align-items: baseline; margin-block: 1em;">
      <label style="display: flex; flex: 1; align-items: baseline; gap: 1em;">
        Show commits until:
        <input type="range" id="commit-progress" min="0" max="100" value="100"
               style="flex: 1;">
        <time id="commit-time-display"></time>
      </label>
    </div>

    <!-- Step 2: File unit visualization — above scatter plot, updates with slider -->
    <h2>File sizes over time</h2>
    <dl id="files"></dl>

    <h2>Commits by time of day</h2>

    <!-- Step 3.1: Scrollytelling wrapper -->
    <div id="scrolly-1">
      <div id="scatter-story"></div>
      <div id="scatter-plot">
        <div id="chart"></div>
        <p id="selection-count">No commits selected</p>
        <dl id="language-breakdown" class="stats"></dl>
      </div>
    </div>

    <dl id="commit-tooltip" class="info tooltip" hidden>
      <dt>Commit</dt>
      <dd><a href="" id="commit-link" target="_blank"></a></dd>
      <dt>Date</dt>
      <dd id="commit-date"></dd>
      <dt>Time</dt>
      <dd id="commit-time"></dd>
      <dt>Author</dt>
      <dd id="commit-author"></dd>
      <dt>Lines edited</dt>
      <dd id="commit-lines"></dd>
    </dl>
  </body>
</html>
